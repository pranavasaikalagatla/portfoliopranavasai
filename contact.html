<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact — Pranava Sai</title>
<style>
:root{--bg:#050505;--line:rgba(255,255,255,.14);--muted:#888;--text:#f5f5f5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:
radial-gradient(circle at 20% 10%,rgba(255,255,255,.08),transparent 28%),
radial-gradient(circle at 85% 80%,rgba(255,255,255,.05),transparent 30%),#050505;
color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:30px;overflow-x:hidden}
body:before{content:"";position:fixed;width:55vw;height:55vw;border:1px solid rgba(255,255,255,.06);border-radius:50%;animation:r 18s linear infinite;pointer-events:none}
@keyframes r{to{transform:rotate(360deg) scale(1.08)}}
.wrap{width:min(980px,100%);display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:rgba(10,10,11,.85);backdrop-filter:blur(18px);box-shadow:0 30px 100px rgba(0,0,0,.45)}
.copy{padding:55px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;min-height:650px}
.eyebrow{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#777}.copy h1{font-size:clamp(55px,8vw,95px);line-height:.84;letter-spacing:-.07em;margin:55px 0 20px}.copy p{color:#888;line-height:1.8;font-size:13px;max-width:420px}.back{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#aaa}.details{display:grid;gap:10px}.details a{color:#aaa;font-size:12px;border-bottom:1px solid var(--line);padding:12px 0}.form{padding:55px}.form h2{font-size:26px;margin:0 0 8px}.form>p{color:#777;font-size:12px;margin:0 0 30px;line-height:1.7}.group{margin-bottom:18px}.group label{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#666;margin-bottom:7px}.group input,.group textarea{width:100%;background:#111114;border:1px solid var(--line);color:#fff;border-radius:12px;padding:14px;outline:0;font:inherit;font-size:13px;transition:.25s}.group input{height:48px}.group textarea{min-height:150px;resize:vertical}.group input:focus,.group textarea:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.05)}button{width:100%;padding:15px;border:1px solid #fff;background:#fff;color:#000;border-radius:999px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font-size:10px;transition:.25s}button:hover{background:#ddd;transform:translateY(-2px)}
@media(max-width:760px){body{padding:12px}.wrap{grid-template-columns:1fr}.copy{min-height:auto;padding:32px;border-right:0;border-bottom:1px solid var(--line)}.copy h1{margin:35px 0 18px}.form{padding:32px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="copy">
    <div><a class="back" href="index.html">← Back to portfolio</a><div class="eyebrow" style="margin-top:70px">/ Contact</div><h1>Let's<br>talk.</h1><p>Have a question or want to work together? Send your message below.</p></div>
    <div class="details">
      <a href="mailto:kalagatlapranavasai@gmail.com">kalagatlapranavasai@gmail.com ↗</a>
      <a href="tel:+918897595016">+91 88975 95016 ↗</a>
    </div>
  </section>
  <section class="form">
    <h2>Get in touch</h2><p>From innovative ideas to exciting projects and professional opportunities — let’s connect and build something meaningful.</p>
    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="19a2b87f-6ef3-4ebe-abb3-d6cdcc3d50be">
      <input type="hidden" name="subject" value="New portfolio contact — Pranava Sai">
      <input type="hidden" name="from_name" value="Pranava Sai Portfolio">
      <div class="group"><label>Name</label><input name="name" placeholder="Your name" required></div>
      <div class="group"><label>Email</label><input type="email" name="email" placeholder="you@example.com" required></div>
      <div class="group"><label>Message</label><textarea name="message" placeholder="Tell me what you're working on..." required></textarea></div>
      <button type="submit">Send message ↗</button>
    </form>
  </section>
</div>
</body>
</html>
