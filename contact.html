<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Contact Me</title>
 <style>
     * {
         box-sizing: border-box;
     }
     body {
         margin: 0;
         min-height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center;

         font-family: Arial, sans-serif;

         background:
             radial-gradient(circle at 20% 20%,
                 rgba(0, 255, 204, 0.15),
                 transparent 30%),
             radial-gradient(circle at 80% 80%,
                 rgba(33, 150, 243, 0.15),
                 transparent 30%),
             linear-gradient(135deg,
                 #020617,
                 #071426,
                 #030712);

         color: white;

         overflow: hidden;

     }
     /* =========================================
        BACKGROUND PARTICLES
        ========================================= */

     body::before {

         content: "";

         position: fixed;

         width: 400px;

         height: 400px;

         border-radius: 50%;

         border: 1px solid rgba(0, 255, 204, 0.12);

         animation:
             rotateCircle 12s linear infinite;

         pointer-events: none;

     }


     body::after {

         content: "";

         position: fixed;

         width: 650px;

         height: 650px;

         border-radius: 50%;

         border: 1px solid rgba(33, 150, 243, 0.08);

         animation:
             rotateCircleReverse 18s linear infinite;

         pointer-events: none;

     }


     @keyframes rotateCircle {

         from {
             transform:
                 rotate(0deg) scale(1);
         }

         to {
             transform:
                 rotate(360deg) scale(1.08);
         }

     }


     @keyframes rotateCircleReverse {

         from {
             transform:
                 rotate(360deg) scale(1);
         }

         to {
             transform:
                 rotate(0deg) scale(1.1);
         }

     }


     /* =========================================
        FORM CONTAINER
        ========================================= */

     .contact-container {

         width: min(500px, 90%);

         padding: 40px;

         border-radius: 25px;

         background:
             rgba(10, 22, 38, 0.78);

         border:
             1px solid rgba(0, 255, 204, 0.25);

         backdrop-filter:
             blur(18px);

         -webkit-backdrop-filter:
             blur(18px);

         box-shadow:
             0 20px 60px rgba(0, 0, 0, 0.45),

             0 0 30px rgba(0, 255, 204, 0.08);

         position: relative;

         z-index: 2;

         animation:
             formEntrance 1s ease-out;

     }


     @keyframes formEntrance {

         from {

             opacity: 0;

             transform:
                 translateY(50px) scale(0.9);

         }

         to {

             opacity: 1;

             transform:
                 translateY(0) scale(1);

         }

     }


     /* =========================================
        HEADING
        ========================================= */

     .contact-container h1 {

         text-align: center;

         margin-top: 0;

         margin-bottom: 10px;

         color: #00ffcc;

         font-size: 35px;

         text-shadow:
             0 0 10px rgba(0, 255, 204, 0.5);

         animation:
             headingGlow 2s ease-in-out infinite alternate;

     }


    .contact-container .subtitle {

         text-align: center;

         color: #aebed0;

         margin-bottom: 30px;

     }


     @keyframes headingGlow {

         from {

             text-shadow:
                 0 0 4px rgba(0, 255, 204, 0.2);

         }

         to {

             text-shadow:
                 0 0 15px rgba(0, 255, 204, 0.7);

         }

     }


     /* =========================================
        FORM GROUP
        ========================================= */

     .form-group {

         position: relative;

         margin-bottom: 25px;

     }


     /* =========================================
        INPUTS
        ========================================= */

     input,
     textarea {

         width: 100%;

         padding: 15px;

         border-radius: 12px;

         border:
             1px solid rgba(255, 255, 255, 0.15);

         outline: none;

         background:
             rgba(255, 255, 255, 0.06);

         color: white;

         font-size: 15px;

         transition:
             border 0.3s ease,
             box-shadow 0.3s ease,
             transform 0.3s ease,
             background 0.3s ease;

     }


     input {

         height: 52px;

     }


     textarea {

         min-height: 140px;

         resize: vertical;

     }


     input::placeholder,
     textarea::placeholder {

         color:
             rgba(255, 255, 255, 0.5);

     }


     /* =========================================
        INPUT FOCUS
        ========================================= */

     input:focus,
     textarea:focus {

         border-color:
             #00ffcc;

         background:
             rgba(0, 255, 204, 0.05);

         box-shadow:
             0 0 8px rgba(0, 255, 204, 0.25),

             0 0 20px rgba(0, 255, 204, 0.08);

         transform:
             translateY(-2px);

     }


     /* Animated focus line */

     .form-group::after {

         content: "";

         position: absolute;

         bottom: 0;

         left: 50%;

         width: 0;

         height: 2px;

         background:
             #00ffcc;

         box-shadow:
             0 0 8px #00ffcc;

         transform:
             translateX(-50%);

         transition:
             width 0.4s ease;

     }


     .form-group:focus-within::after {

         width: 100%;

     }


     /* =========================================
        BUTTON
        ========================================= */

     button {

         width: 100%;

         padding: 15px;

         border: none;

         border-radius: 12px;

         background:
             linear-gradient(90deg,
                 #00a98f,
                 #00ffcc,
                 #2196f3);

         background-size:
             200% 100%;

         color: #001411;

         font-size: 16px;

         font-weight: bold;

         cursor: pointer;

         position: relative;

         overflow: hidden;

         transition:
             transform 0.3s ease,
             box-shadow 0.3s ease;

         animation:
             buttonGradient 4s ease infinite;

     }


     @keyframes buttonGradient {

         0% {
             background-position: 0% 50%;
         }

         50% {
             background-position: 100% 50%;
         }

         100% {
             background-position: 0% 50%;
         }

     }


     button:hover {

         transform:
             translateY(-4px) scale(1.02);

         box-shadow:
             0 0 12px rgba(0, 255, 204, 0.6),

             0 10px 30px rgba(0, 0, 0, 0.3);

     }


     button:active {

         transform:
             translateY(0) scale(0.98);

     }


     /* =========================================
        BUTTON SHINE
        ========================================= */

     button::before {

         content: "";

         position: absolute;

         top: 0;

         left: -100%;

         width: 50%;

         height: 100%;

         background:
             linear-gradient(90deg,
                 transparent,
                 rgba(255, 255, 255, 0.5),
                 transparent);

         transform:
             skewX(-20deg);

         transition:
             left 0.6s ease;

     }


     button:hover::before {

         left: 150%;

     }


     /* =========================================
        LABEL-LIKE PLACEHOLDER EFFECT
        ========================================= */

     input:valid,
     textarea:valid {

         border-color:
             rgba(0, 255, 204, 0.25);

     }


     /* =========================================
        FORM SUCCESS ANIMATION
        ========================================= */

     form {

         animation:
             formFade 1.3s ease-out;

     }


     @keyframes formFade {

         from {
             opacity: 0;
         }

         to {
             opacity: 1;
         }

     }


     /* =========================================
        MOBILE
        ========================================= */

     @media (max-width: 600px) {

         .contact-container {

             padding: 25px;

             width: 92%;

         }


         .contact-container h1 {

             font-size: 28px;

         }


         input,
         textarea {

             font-size: 14px;

         }

     }


     /* =========================================
        REDUCED MOTION
        ========================================= */

     @media (prefers-reduced-motion: reduce) {

         *,
         *::before,
         *::after {

             animation:
                 none !important;

             transition:
                 none !important;

         }

     }
 </style>

</head>


<body>


 <div class="contact-container">


     <h1>
         Get In Touch
     </h1>


     <p class="subtitle">
         Have a question or want to work together?
     </p>


     <form action="https://api.web3forms.com/submit" method="POST">


         <input type="hidden" name="access_key" value="19a2b87f-6ef3-4ebe-abb3-d6cdcc3d50be">


         <div class="form-group">

             <input type="text" name="name" placeholder="Your Name" required>

         </div>


         <div class="form-group">

             <input type="email" name="email" placeholder="Your Email" required>

         </div>


         <div class="form-group">

             <textarea name="message" placeholder="Your Message" required></textarea>

         </div>


         <button type="submit">

             Submit Form

         </button>


     </form>


 </div>


</body>

</html>
